<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="chat.css">
<script>
  window.__pushQueue = [];
  window.__push = function (p) { window.__pushQueue.push(p); };
</script>
</head>
<body>
  <div id="app">
    <div id="head">
      <div class="head-left">
        <span id="chan-name">omatv chat</span>
        <span id="chan-live" class="live-chip hidden">LIVE</span>
      </div>
      <span id="viewers" class="hidden"></span>
      <div id="conn" class="conn connecting">connecting…</div>
    </div>

    <div id="msgs"></div>

    <button id="resume" class="hidden">Chat paused — resume ▾</button>

    <form id="composer">
      <div id="tab-pop" class="hidden">
        <div id="tab-list"></div>
      </div>
      <div id="emote-pop" class="hidden">
        <input id="emote-search" type="text" placeholder="Search emotes…">
        <div id="emote-grid"></div>
      </div>
      <div class="composer-row">
        <button type="button" id="emote-btn" title="Emotes">😊</button>
        <div id="msg-input" contenteditable="true" role="textbox" aria-multiline="false" data-placeholder="Send a message…"></div>
        <button type="submit" id="send-btn">Chat</button>
      </div>
      <div id="notice"></div>
    </form>
  </div>
  <script src="chat.js"></script>
</body>
</html>
